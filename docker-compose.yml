# Local stack: API + 2 scan workers + Postgres + Redis + MinIO (S3).
#   docker compose up --build    then open http://localhost:8080
services:
  api:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    command: ["node", "dist/api.js"]
    ports: ["8080:8080"]
    environment: &env
      DATABASE_URL: postgres://reposafety:reposafety@postgres:5432/reposafety
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: repo-safety-uploads
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      PUBLIC_BASE_URL: http://localhost:8080
      # GITHUB_TOKEN: optional, raises GitHub API rate limits
    depends_on: [postgres, redis, minio-setup]

  worker:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    command: ["node", "dist/worker.js"]
    environment: *env
    deploy: { replicas: 2, resources: { limits: { cpus: "1", memory: 1g } } }
    read_only: true
    depends_on: [postgres, redis, minio-setup]

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: reposafety, POSTGRES_PASSWORD: reposafety, POSTGRES_DB: reposafety }
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    ports: ["9001:9001"]
    volumes: [miniodata:/data]

  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/repo-safety-uploads; mc ilm rule add --expire-days 1 local/repo-safety-uploads; exit 0"

volumes:
  pgdata:
  miniodata:
